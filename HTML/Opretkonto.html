  <!DOCTYPE html>
<html lang="en">

<head>


  <script>

    function SavePassword(){


      const mpass = document.getElementById('mpass').value;

      const mpassJSON = JSON.stringify(mpass);


      localStorage.setItem("pass", mpassJSON);

    }


    function SaveEmail(){

      let email = JSON.stringify(document.getElementById('email').value);

      localStorage.setItem("email",email)

      const JSONemail = JSON.parse(localStorage.getItem("email"));


    }


    function CheckInput() {


      let mpass = document.getElementById('mpass').value;

      let cmpass = document.getElementById('cmpass').value;

      let email = document.getElementById('email').value;

      let emailPart = email.match(/.{1}/g);



        for(var n=0; emailPart[n]; n++ ){
          if (emailPart[n] === "@"){
            if (mpass === cmpass){

              document.getElementById("11").style.visibility='visible';
              SaveEmail();
              SavePassword();

            } else {

              document.getElementById("11").style.visibility='hidden';

            }


          }
        }
    }


  </script>
