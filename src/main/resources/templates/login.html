<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="Opretkonto.css">

    <script>

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("loginpass");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }
        }
    </script>

</head>

<body style="background-color: #000000;">
<header>
    <div class="center-img">
        <img src="logo.png" alt="Keyspiracy logo" class="center-img">
        <hr>
    </div>
</header>


<div class="center-text">
    <div class="font-style1">
        <div class="box1">
            Login

            <div class="font-style2">

            <div class="center-text">

              <div class="font-style1">

                  <hr>
                  <br>
                  <form id="confirm" action="/login" method="post">
                      <div class="font-style2">
                          Email
                          <div class="input-box">
                              <input type="email" id="email" name="loginEmail" class="input-box" size="40"
                                      required style="color: #94aadf">

                          </div>
                          <br>

                          Password
                          <input type="password" id="loginpass" name="loginPass" class="input-box" size="40"
                                  required style="color: #94aadf">
                          <br>
                          <br>
                          <input type="checkbox" id="showPassword" onclick="togglePasswordVisibility()"> Show password
                          <br>
                          <br>
                          <footer th:text="${error}" style="color: #ff0000" ></footer>

                          <br>


                          <div class="button-style1">
                              <button type="submit"> Continue</button>
                          </div>
                      </div>

                      <br>
                  </form>
                  <div class="button-style1">
                      <form action="/register" method="get"> <button type="submit" style="scale: 70% "> Register new account </button> </form>
                  </div>

              </div>
              </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
