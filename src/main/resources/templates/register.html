    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('mpass');
            const cmpassInput = document.getElementById('cmpass');
            if (passwordInput.type === 'password' ) {
                passwordInput.type = 'text';
                cmpassInput.type = 'text';
            } else {
                passwordInput.type = 'password';
                cmpassInput.type = 'password';
            }
        }
        function CheckInput(){
            const email = document.getElementById('email').value;
            const mpass = document.getElementById('mpass').value;
            const cmpass= document.getElementById('cmpass').value;

            const ok = email.includes("@") && mpass !== "" && mpass ===cmpass;
            if (ok === true){
                document.getElementById("11").style.visibility = 'visible'
            }else {
                document.getElementById("11").style.visibility = 'hidden';
            }
        }

    </script>
