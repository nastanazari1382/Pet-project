<!DOCTYPE html>
<html lang="en">
<head>

    <script>

        function SavaPassword(){
            const mpass = document.getElementById('mpass').value;
            const mpassJSON = JSON.stringify(mpass);
            localStorage.setItem("pass", mpassJSON);
        }
        function SaveEmail() {
            let email= JSON.stringify(document.getElementById('email').value);
            localStorage.setItem("email", email)
            const JSONemail = JSON.parse(localStorage.getItem("email"));
        }
        function ChechInput(){
            const email = document.getElementById('email').value;
            const mpass = document.getElementById('mpass').value;
            const cmpass= document.getElementById('cmpass').value;

            const ok = email.includes("@") && mpass !== "" && mpass ===cmpass;
            if (ok === true){
                document.getElementById("11").style.visibility = 'visible'
            }else {
                document.getElementById("11").style.visibility = 'hidden';
            }
        }
    </script>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="OpretKonto.css">
    <title> Title </title>
</head>
<body style="background-color: #000000;">

<header>
    <div class="center-img">
        <img src="logo.png" alt="Keyspiracy logo" class="center-img">
        <hr>
    </div>
</header>

<div class="center-text">
    <div class="font-style1">
        Create account
        <hr>
        <br>
        <form id="confirm" action="/register" method="post">
            <div class="font-style2">
                Email
                <div class="input-box">
                    <input type="email" id="email" name="email" class="input-box" size="40" oninput="ChechInput()" required style="color: #94aadf">
                </div>
                <br>
                <div class="font-style2">
                    Master-password
                    <div class="input-box">
                        <input type="password" id="mpass" name="mpass" class="input-box" size="40" oninput="ChechInput()" required style="color: #94aadf">
                    </div>
                    <br>
                    <div class="font-style2">
                        Confirm Master-Password
                    </div>
                </div>

                <div class="input-box">
                   <input type="password" id="cmpass" name="cmpass" class="input-box" size="40" oninput="ChechInput()" required style="color: #94aadf">
                </div>
                <br>
                Efter oprettelse vises en genoprettelsesnøgle, som skal gemmes og bekræftes.
                <br>
                <div class="button-style1">
                    <button type="submit" style='visibility: hidden' id="11"> Register </button>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
