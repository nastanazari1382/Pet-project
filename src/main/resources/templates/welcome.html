<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="Opretkonto.css">
    <script>
        function ShowEmail(){

            document.getElementById("RecKey").innerHTML = JSON.parse(localStorage.getItem("email"));

        }
    </script>

</head>

<body style="background-color: #000000;">
<header>
    <div class="center-img">
        <img src="logo.png" alt="Keyspiracy logo" class="center-img">
        <hr>
        </div>
</header>


<div class="center-text">

    <div class="font-style1">
        <div class="box1">
            Save your Recovery-Key

            <hr>
            <br>
            <div class="font-style2">
                Save this Recovery-Key to be able to recover your account, if you forget your password.
                <br>
                <br>
                This key will only be shown once



                <h1 th:text="${session.user.username}"> email </h1>

                <form>

                    <div class="input-box">

                        <output type="text" id="RecKey" name="Key" class="input-box" size="40" onmouseover="ShowEmail()">

                            Recovery-Key-Example
                        </output>

                    </div>
                    <br>
                    <br>
                    <br>

                    <div class="button-style1">
                        <button type="submit"> Continue </button>

                    </div>
                <br>
                </form>
            </div>
        </div>
    </div>

</div>





</body>
</html>
